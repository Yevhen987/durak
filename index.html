function pool(){
  const out=[];
  for(let s=0;s<4;s++)for(let r=6;r<=14;r++){
    const c={s,r};

    if(table.some(t=>same(t.a,c)||(t.d&&same(t.d,c))))continue;

function botPick(){
  const cnt=c=>B.filter(x=>x.r===c.r).length;

function showHint(){

function play(i){hint='';

  <button class="btn" onclick="oCreate()">Создать игру</button><div class="nm">или введите код друга:</div><input id="oc" maxlength="4" inputmode="numeric" placeholder="0000" autocomplete="off" style="font:700 26px system-ui,sans-serif;text-align:center;padding:8px;border-radius:10px;border:0;width:150px;margin:0 auto"><button class="btn" onclick="oJoin()">Войти</button><div id="om" class="nm">Подключение…</div></div>`;
  try{const n=localStorage.getItem('oname');if(n)document.getElementById('on').value=n}catch(e){}
  if(ACC){const o=document.getElementById('on');o.value=ACC.nick;o.disabled=true;o.style.opacity=.7}
  odb=odb||await getDb();
  const m=document.getElementById('om');
  if(m)m.textContent=odb?'':'Нет связи с сервером игры. Проверьте интернет и попробуйте снова.';
}
async function oCreate(){
  if(!odb)return;
  try{
    let code,s;
    do{code=String(1000+Math.random()*9000|0);s=await odb.doc('rooms/'+code).get()}while(s.exists&&!s.data().end&&Date.now()-(s.data().ts||0)<864e5);
    me=0;oref=odb.doc('rooms/'+code);
    const nmc=myName(),bad=await guestNickTaken(nmc);if(bad)return document.getElementById('om').textContent=bad;
    const g=deal(onp,perev);g.j[0]=true;g.n[0]=nmc;g.u[0]=ACC?ACC.uid:'';
    await oref.set(clean(g));oWatch(code);
  }catch(e){document.getElementById('om').textContent='Не удалось создать игру. Проверьте интернет.'}
}
async function oJoin(){
  const code=normCode(document.getElementById('oc').value),m=document.getElementById('om');
  if(!odb)return m.textContent='Нет связи с сервером игры. Проверьте интернет.';
  if(code.length!==4)return m.textContent='Код должен состоять из 4 цифр.';
  try{
    const r=odb.doc('rooms/'+code),s=await r.get();
    if(!s.exists)return m.textContent='Игра с таким кодом не найдена.';
    const nm=myName(),bad=await guestNickTaken(nm);if(bad)return m.textContent=bad;let slot=-1;const myU=ACC?ACC.uid:'';
    await txDoc(r,raw=>{
      if(!raw)return raw;
      const g=norm(raw);slot=-1;
      if(g.ready)return;
      slot=g.j.findIndex(x=>!x);if(slot<0)return;
      g.j[slot]=true;g.n[slot]=nm;g.u[slot]=myU;if(g.j.every(x=>x)){g.ready=true;g.ts=Date.now()}
      return clean(g);
    });
    if(slot<0)return m.textContent='В этой игре уже нет свободных мест.';
    me=slot;oref=r;oWatch(code);
  }catch(e){m.textContent='Не удалось войти в игру. Проверьте интернет.'}
}
function oWatch(code){
  ocode=normCode(code);try{localStorage.setItem('osess',ocode+me)}catch(e){}if(ounsub)ounsub();
  ounsub=oref.onSnapshot(s=>{
    if(!s.exists)return;
    const g=norm(s.data()),prev=G;onote='';
    if(prev&&prev.table.length&&!g.table.length)sweepFX(prev.take?(prev.def===me?'down':'up'):'bito');
    if(prev&&g.deck.length>prev.deck.length){oHandSeen.clear();oOppSeen={}}
    if(prev&&prev.ready&&!prev.end&&g.end&&ACC&&g.u[me]===ACC.uid&&g.u.every(x=>x)&&new Set(g.u).size===g.np)recordResult(g.end!=='draw'&&g.end!==String(me));
    G=g;oRender();
  },()=>{$a().textContent='Ошибка связи с игрой.'});
}
function oPlay(i){oAct(g=>mvPlay(g,me,i))}
function oTake(){oAct(g=>mvTake(g,me))}
function oPass(){oAct(g=>mvPass(g,me),true)}
async function oAgain(){
  if(!oref)return;
  try{await txDoc(oref,raw=>{
    if(!raw)return raw;const g=norm(raw);if(!g.end)return;
    const ng=deal(g.np,g.perev);ng.j=g.j;ng.n=g.n;ng.u=g.u;ng.sc=g.sc;ng.ready=true;return clean(ng);
  })}catch(e){oSay('Не удалось начать новую игру.')}
}
function oLeave(){oHandSeen.clear();oOppSeen={};oShown.clear();if(ounsub){ounsub();ounsub=null}G=null;try{localStorage.removeItem('osess')}catch(e){}init()}
function oState(){
  const g=G;if(!g)return 'wait';
  if(!g.ready)return 'lobby';
  if(g.end)return 'end';
  if(g.out[me])return 'out';
  if(me===g.def){if(g.take)return 'taking';return g.table.some(t=>!t.d)?'def':'wait'}
  if(!g.table.length)return me===g.att?'atk':'wait';
  return 'add';
}
function oRender(){
  if(!G)return;
  const g=G,st=oState(),mine=g.h[me],red=g.trump.s===1||g.trump.s===2;
  const dn=esc(pn(g,g.def)),an=esc(pn(g,g.att));
  const others=[];for(let k=1;k<g.np;k++)others.push((me+k)%g.np);
  const status=i=>!g.ready?(g.j[i]?'в игре':'ждём…'):g.end?'':g.out[i]?'вышел ✔':i===g.def?(g.take?'берёт':'отбивается'):(!g.table.length&&i===g.att)?'ходит':g.pass[i]?'пас':i===g.att?'атакует':'';
  const opps=others.map(i=>{
    const cnt=g.ready?g.h[i].length:0,show=Math.min(cnt,8),prev=Math.min(oOppSeen[i]??0,show);oOppSeen[i]=show;
    const backs=Array.from({length:show},(_,k)=>`<div class="c b mini${k>=prev?' dealb':''}"${k>=prev?` style="animation-delay:${(k-prev)*70}ms"`:''}></div>`).join('');
    const cls=g.ready&&!g.end&&!g.out[i]?(i===g.def?' def':i===g.att?' att':''):'';
    return `<div class="opp${cls}"><div class="av${frCls(g.u[i])}">${avImg(g.u[i],EM[i])}${frImg(frameOf(g.u[i]))}<em>${g.ready?cnt:'–'}</em></div><div class="nm">${g.j[i]?esc(pn(g,i)):'…'}${ADMINS[g.u[i]]?' '+DEVB:''}<br><small>${status(i)}</small></div><div class="minis">${backs}</div></div>`;
  }).join('');
  let body;
  if(!g.ready){
    const joined=g.j.filter(x=>x).length;
    body=`<div class="opps">${opps}</div><div class="box" style="margin-top:10px"><div class="nm">Код игры — отправьте его друзьям:</div><div class="big" style="font-size:44px;letter-spacing:6px">${ocode}</div><div class="nm" style="font-size:15px">Ждём игроков: ${joined} из ${g.np}…</div></div>`;
  }else{
    const tr=g.deck.length?face(g.trump,'tr'):`<div class="c f s${g.trump.s} tr dim"><svg class="mid" viewBox="0 0 24 24"><use href="#p${g.trump.s}"/></svg></div>`;
    const dk=`<div class="deckbox">${tr}${g.deck.length>1?`<div class="c b dk">${g.deck.length}</div>`:''}<span class="tl ${red?'rd':''}">Козырь ${S[g.trump.s]}</span></div>`;
    const op=(c,mine)=>oShown.has(ck(c))?'':mine?'fu':'fd';
    const tb=g.table.map(t=>`<div class="pair">${face(t.a,op(t.a,t.p===me))}${t.d?face(t.d,'d '+op(t.d,g.def===me)):''}</div>`).join('');
    oShown=new Set(g.table.flatMap(t=>t.d?[ck(t.a),ck(t.d)]:[ck(t.a)]));
    const allDef=g.table.length&&g.table.every(t=>t.d);
    let acts='';
    if(st==='def')acts='<button class="btn red" onclick="oTake()">Беру</button>';
    if(st==='add'&&!g.pass[me]&&(g.take||allDef))acts=`<button class="btn" onclick="oPass()">${g.take?'Готово':'Бито'}</button>`;
    const m=st==='atk'?'Ваш ход.':
      st==='def'?'Отбейтесь'+(g.perev?', переведите':'')+' или возьмите.':
      st==='taking'?'Вы берёте. Ждём, пока подкинут.':
      st==='out'?'Вы вышли из игры — вы не дурак! 🎉 Ждём конца.':
      st==='add'?(g.pass[me]?'Ждём остальных…':g.take?dn+' берёт. Подкиньте или нажмите «Готово».':allDef?'Подкиньте или нажмите «Бито».':dn+' отбивается. Можно подкинуть.'):
      !g.table.length?'Ходит '+an+'…':g.take?dn+' берёт карты.':dn+' отбивается…';
    const srt=mine.map((c,i)=>({c,i})).sort((x,y)=>oV(x.c)-oV(y.c));
    const odl=dealCls(srt.map(x=>x.c),oHandSeen);
    const hand=srt.map(({c,i},k)=>face(c,odl[k][0],'button',`onclick="tapCard(this,()=>oPlay(${i}))"${odl[k][1]}`)).join('');
    const ovl=mine.length>1?Math.max(-36,Math.min(-26,(Math.min(innerWidth,560)-24-54)/(mine.length-1)-54)):-26;
    const score=seats(g).map(i=>`${esc(pn(g,i))} ${g.sc[i]}`).join(' · ');
    const endTxt=g.end==='draw'?'Ничья!':+g.end===me?'Вы остались дураком.':g.np===2?'Вы выиграли! 🎉':'Вы не дурак! 🎉<div class="nm" style="font-size:16px;margin-top:8px">Дурак: '+esc(pn(g,+g.end))+'</div>';
    const end=g.end?`<div class="ov"><div class="box"><div class="big">${endTxt}</div><div class="nm" style="font-size:14px">Сколько раз был дураком:<br>${score}</div><button class="btn" onclick="oAgain()">Сыграть ещё</button></div></div>`:'';
    const myCls=!g.end&&!g.out[me]?(me===g.def?' def':me===g.att?' att':''):'';
    body=`<div class="opps">${opps}</div>
  <div class="table">${dk}<div class="tcards">${tb||''}</div></div>
  <div class="pill">${onote||m}</div><div class="acts">${acts}</div>
  <div class="pl"><div class="avc"><div class="av${myCls}${frCls(g.u[me])}">${avImg(g.u[me],EM[me])}${frImg(frameOf(g.u[me]))}<em>${mine.length}</em></div>${ACC&&ACC.uid===g.u[me]?coinBadge():''}</div><div class="nm">${esc(pn(g,me))} (вы)${ADMINS[g.u[me]]?' '+DEVB:''}${status(me)?' · '+status(me):''}</div></div>
  <div class="row hand" style="--ov:${ovl}px">${hand}</div>${end}`;
  }
  $a().innerHTML=`<div class="hd"><b>🌐 Durak Online<small>${g.perev?'переводной':'подкидной'} · ${g.np} игрока · код ${ocode}${g.u.every(x=>x)&&new Set(g.u).size===g.np?' · 🏆 рейтинговая':''}</small></b><span class="hr"><button class="mbtn lbb" onclick="openShop()" title="Магазин" aria-label="Магазин"><svg class="cart" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 3h2.6l2.3 11.2a2 2 0 0 0 2 1.6h8.6a2 2 0 0 0 2-1.5L21.4 7H6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9.5" cy="20" r="1.7" fill="currentColor"/><circle cx="17.5" cy="20" r="1.7" fill="currentColor"/></svg></button><button class="mbtn lbb frBtn" onclick="openFriends()" title="Друзья" aria-label="Друзья">👥${frBadge()}</button><button class="mbtn lbb" onclick="openLeaders()" title="Лидеры" aria-label="Таблица лидеров">🏆</button><button class="mbtn" onclick="openMenu()">☰ Меню</button></span></div>${body}`;
}
async function oResume(){
  let v;try{v=localStorage.getItem('osess')}catch(e){}
  if(!v||!/^[A-Z0-9]{4}[0-3]$/.test(v))return;
  try{
    odb=odb||await getDb();if(!odb)return;
    const r=odb.doc('rooms/'+v.slice(0,4)),s=await r.get();
    if(!s.exists||s.data().end||!s.data().np){localStorage.removeItem('osess');return}
    gen++;me=+v[4];oref=r;oWatch(v.slice(0,4));
  }catch(e){}
}
init();oResume();
applySkin();getAuth();authReady.then(()=>{try{if(!ACC&&!localStorage.getItem('oname'))openAccount('welcome')}catch(e){}});setTimeout(()=>authReadyRes(),8000);
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
